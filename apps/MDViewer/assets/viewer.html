  width: 1em;
  height: 1em;
}

.markdown-body .task-list-item {
  list-style-type: none;
}

.markdown-body .task-list-item label {
  font-weight: 400;
}

.markdown-body .task-list-item.enabled label {
  cursor: pointer;
}

.markdown-body .task-list-item+.task-list-item {
  margin-top: 4px;
}

.markdown-body .task-list-item .handle {
  display: none;
}

.markdown-body .task-list-item-checkbox {
  margin: 0 .2em .25em -1.4em;
  vertical-align: middle;
}

.markdown-body .contains-task-list:dir(rtl) .task-list-item-checkbox {
  margin: 0 -1.6em .25em .2em;
}

.markdown-body .contains-task-list {
  position: relative;
}

.markdown-body .contains-task-list:hover .task-list-item-convert-container,
.markdown-body .contains-task-list:focus-within .task-list-item-convert-container {
  display: block;
  width: auto;
  height: 24px;
  overflow: visible;
  clip: auto;
}

.markdown-body ::-webkit-calendar-picker-indicator {
  filter: invert(50%);
}

.markdown-body .markdown-alert {
  padding: 8px 16px;
  margin-bottom: 16px;
  color: inherit;
  border-left: .25em solid #d0d7de;
}

.markdown-body .markdown-alert>:first-child {
  margin-top: 0;
}

.markdown-body .markdown-alert>:last-child {
  margin-bottom: 0;
}

.markdown-body .markdown-alert .markdown-alert-title {
  display: flex;
  font-weight: 500;
  align-items: center;
  line-height: 1;
}

.markdown-body .markdown-alert.markdown-alert-note {
  border-left-color: #0969da;
}

.markdown-body .markdown-alert.markdown-alert-note .markdown-alert-title {
  color: #0969da;
}

.markdown-body .markdown-alert.markdown-alert-important {
  border-left-color: #8250df;
}

.markdown-body .markdown-alert.markdown-alert-important .markdown-alert-title {
  color: #8250df;
}

.markdown-body .markdown-alert.markdown-alert-warning {
  border-left-color: #9a6700;
}

.markdown-body .markdown-alert.markdown-alert-warning .markdown-alert-title {
  color: #9a6700;
}

.markdown-body .markdown-alert.markdown-alert-tip {
  border-left-color: #1f883d;
}

.markdown-body .markdown-alert.markdown-alert-tip .markdown-alert-title {
  color: #1a7f37;
}

.markdown-body .markdown-alert.markdown-alert-caution {
  border-left-color: #cf222e;
}

.markdown-body .markdown-alert.markdown-alert-caution .markdown-alert-title {
  color: #d1242f;
}

/* ============================================================
   MDViewer - estilos propios (capa encima de github-markdown-light.css)
   Fondo blanco fijo, sin modo oscuro: pedido explicito del dueño.
   ============================================================ */

*, *::before, *::after { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: #ffffff;
  overflow-x: hidden; /* la pagina jamas debe scrollear en horizontal */
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
}

/* --- Barra superior: minima, discreta, sticky, sin ruido --- */
.mdv-topbar {
  position: sticky;
  top: 0;
  z-index: 10;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  height: 44px;
  padding: 0 20px;
  background: #ffffff;
  border-bottom: 1px solid #d0d7de;
}

.mdv-filename {
  flex: 1 1 auto;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: 13px;
  font-weight: 600;
  color: #1F2328;
}

.mdv-export-btn {
  flex: 0 0 auto;
  font-family: inherit;
  font-size: 13px;
  font-weight: 500;
  color: #1F2328;
  background: #f6f8fa;
  border: 1px solid rgba(27,31,36,0.15);
  border-radius: 6px;
  padding: 5px 12px;
  cursor: pointer;
  transition: background-color .1s ease-in-out;
}

.mdv-export-btn:hover { background: #f3f4f6; }
.mdv-export-btn:active { background: #ebecf0; }

/* --- Ancho de lectura centrado (~860px), como pidio el dueño --- */
#mdv-content.markdown-body {
  max-width: 860px;
  margin: 0 auto;
  padding: 32px 24px 96px;
}

#mdv-content img {
  height: auto; /* evita deformar imagenes que ya limitan max-width:100% */
}

/* --- Listas de tareas (checkboxes) ---
   marked v12 (renderer por defecto) NO añade la clase .task-list-item al
   <li> ni .task-list-item-checkbox al <input> -son los ganchos que trae
   github-markdown-css, pero aqui nunca se activan porque marked no los
   emite-. Sin este fix el <li> conserva su bullet normal ADEMAS del
   checkbox ("• [ ] Hecho" en vez de "[ ] Hecho").
   Fix solo-CSS, sin tocar el JS ni añadir un walker de DOM (visor
   instantaneo: nada de trabajo extra en el render por un detalle
   cosmetico). Selector estructural :has() -Chromium moderno; WebView2 v151
   lo soporta de sobra- que detecta el <li> cuyo primer hijo es un checkbox
   y le quita el marcador de lista. Los valores de margen del checkbox son
   los mismos -0 .2em .25em -1.4em- que github-markdown-css ya definia para
   .task-list-item-checkbox, solo que re-enganchados a un selector que si
   dispara con la salida real de marked.
   Fallback sin :has() (solo importa si alguien abre este HTML suelto en un
   navegador viejo durante desarrollo -nunca en la app real, que corre sobre
   WebView2/Chromium moderno-): no existe forma de replicar la deteccion
   estructural "li que contiene un checkbox" solo con CSS sin :has(), asi
   que en ese caso el bullet reaparece junto al checkbox -degradacion
   puramente cosmetica, aceptada-. El espaciado/alineacion del checkbox de
   abajo si se aplica siempre, con o sin soporte de :has(), asi que al menos
   el checkbox nunca queda pegado al texto. */
#mdv-content li:has(> input[type="checkbox"]) {
  list-style-type: none;
}

#mdv-content li > input[type="checkbox"] {
  margin: 0 .2em .25em -1.4em;
  vertical-align: middle;
}

/* --- Estados vacio / carga / error (usan padding, no margin-top: el vendor
   CSS fuerza margin-top:0 !important en el primer hijo de .markdown-body) --- */
.mdv-placeholder {
  color: #656d76;
  text-align: center;
  padding-top: 96px;
  font-size: 14px;
}

/* --- Impresion / Exportar PDF ---
   El PDF exportado por el C# es literalmente esta hoja de estilos aplicada
   al DOM ya renderizado (WebView2 imprime lo que hay en pantalla), asi que
   se cuida tanto como la vista normal. */
@media print {
  .mdv-topbar {
    display: none !important; /* la barra es solo de la app, no del documento */
  }

  html {
    /* Inherited: fuerza que se impriman fondos de code fences, zebra de
       tablas y bordes de blockquote en vez de que el motor de impresion
       los recorte por "ahorro de tinta". */
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  html, body {
    background: #ffffff !important;
  }

  #mdv-content.markdown-body {
    max-width: none; /* el PDF ya trae sus propios margenes de pagina */
    margin: 0;
    padding: 0;
  }

  .markdown-body pre,
  .markdown-body table,
  .markdown-body img,
  .markdown-body blockquote {
    break-inside: avoid;
    page-break-inside: avoid; /* fallback para motores de impresion viejos */
  }
}
</style>
</head>
<body>

<header class="mdv-topbar" id="mdv-topbar">
  <span class="mdv-filename" id="mdv-filename">MDViewer</span>
  <button type="button" class="mdv-export-btn" id="mdv-export-btn">Exportar PDF</button>
</header>

<main class="markdown-body" id="mdv-content">
  <p class="mdv-placeholder">Cargando documento&hellip;</p>
</main>

<script>
/* ============================================================
   MDViewer - motor de render y contrato con el host C#/WebView2
   ============================================================ */
(function () {
  'use strict';

  // GFM activado explicitamente (tablas, listas de tareas, autolinks, ~~tachado~~).
  // breaks:false (default de GitHub) -> un solo salto de linea dentro de un
  // parrafo NO se convierte en <br>; hacen falta dos saltos (linea en blanco)
  // para separar parrafos, exactamente como en GitHub.com.
  // DECISION (NO cambiar a true sin releer esto): los .md de este repo estan
  // "hard-wrapped" a mano a ~80 columnas -CLAUDE.md es el ejemplo canonico, y
  // las guias de spec/ siguen el mismo estilo-. Con breaks:true cada salto de
  // linea del wrap manual se pintaria como <br>, y un parrafo normal se veria
  // como una escalera rota (una linea corta debajo de otra). El caso de uso
  // real de MDViewer es leer la documentacion de este repo, no notas sueltas
  // de un editor tipo Typora. El dueño ademas pidio literalmente "el mejor
  // formato posible de markdown" = paridad con como se ve en GitHub.
  marked.setOptions({ gfm: true, breaks: false });

  var filenameEl = document.getElementById('mdv-filename');
  var contentEl = document.getElementById('mdv-content');
  var exportBtn = document.getElementById('mdv-export-btn');

  // Permite distinguir "recarga en vivo del mismo archivo" de "se abrio un
  // archivo nuevo" para decidir si conviene resetear el scroll (ver render()).
  var lastTitle = null;

  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
  }

  function showPlaceholder(text) {
    contentEl.innerHTML = '<p class="mdv-placeholder">' + escapeHtml(text) + '</p>';
  }

  // --- Exportar PDF ---
  // El guardado real lo hace el C# (WebView2 CoreWebView2.PrintToPdfAsync o
  // equivalente); este boton solo avisa. El listener se ata UNA vez al cargar
  // el script (el boton nunca se recrea entre llamadas a MDV.render), asi que
  // no hay riesgo de duplicar el handler en una recarga en vivo.
  //
  // Guard: si el HTML se abre suelto en un navegador normal durante desarrollo
  // (sin host WebView2), window.chrome.webview no existe. En ese caso el boton
  // queda inerte (con aviso en consola) en vez de lanzar una excepcion.
  exportBtn.addEventListener('click', function () {
    if (window.chrome && window.chrome.webview) {
      window.chrome.webview.postMessage('export-pdf');
    } else {
      console.warn('MDViewer: window.chrome.webview no disponible (HTML abierto fuera de WebView2). No se envio "export-pdf".');
    }
  });

  // --- Enlaces dentro del documento renderizado ---
  // DECISION (enlaces externos, ver tambien requisito de diseño): esta pagina
  // se carga con NavigateToString, sin una URL base real. Si un <a href="...">
  // navegara dentro del propio WebView2, reemplazaria el documento renderizado
  // por la pagina de destino y "romperia" el visor -el usuario perderia el
  // markdown en pantalla sin forma de volver salvo recargar el archivo desde
  // el explorador otra vez-. Por eso se intercepta CADA click sobre un <a>:
  //   - anclas internas ("#seccion") se dejan pasar tal cual: es scroll dentro
  //     de la misma pagina, no rompe nada.
  //   - el resto se cancela con preventDefault SIEMPRE (asi el atributo
  //     target= del markdown/HTML embebido nunca tiene efecto real, tal como
  //     pide el requisito de diseño).
  //   - fuera de WebView2 (HTML abierto suelto en un navegador durante
  //     desarrollo) se abre en pestaña nueva con window.open para poder
  //     verificar visualmente que los enlaces apuntan donde deben.
  //
  // CONTRATO PARA EL LADO C# (Atlas) -- receptor de "abrir enlace externo":
  //   Formato EXACTO del mensaje que llega a CoreWebView2.WebMessageReceived:
  //     "open-link:" + href
  //   Es un string plano (NO JSON), enviado tal cual con
  //   window.chrome.webview.postMessage(...). El prefijo es literalmente los
  //   10 caracteres "open-link:" seguidos del valor CRUDO del atributo href
  //   del <a> tal como aparece en el markdown/HTML (puede incluir "://", "?",
  //   "&", "#" dentro de la propia URL, etc. -no se hace URL-encoding extra-).
  //   Ejemplos reales que puede recibir el receptor de C#:
  //     "open-link:https://www.byraesoftware.com"
  //     "open-link:mailto:alguien@example.com"
  //     "open-link:relativo/a/otro-archivo.md"  (ruta relativa tal cual, sin resolver)
  //   Para extraer la URL: quitar el prefijo "open-link:" (los primeros 10
  //   caracteres) del string recibido; el resto es el href completo.
  //   Sugerencia de implementacion: abrir con Process.Start(new
  //   ProcessStartInfo(href) { UseShellExecute = true }) para que Windows
  //   decida la app/navegador predeterminado, envuelto en try/catch por si
  //   llega un href relativo o malformado que no sea una URL/ruta valida para
  //   el sistema operativo (MDViewer no valida el href antes de reenviarlo).
  //   Si este receptor no esta implementado, el postMessage es un no-op
  //   inofensivo: el enlace simplemente no navega a ningun lado, pero la app
  //   tampoco se rompe (eso es lo unico realmente exigido).
  contentEl.addEventListener('click', function (e) {
    var a = e.target && e.target.closest ? e.target.closest('a[href]') : null;
    if (!a) return;
    var href = a.getAttribute('href') || '';
    if (href.charAt(0) === '#') return; // ancla interna: scroll nativo, no se toca

    e.preventDefault();
    if (window.chrome && window.chrome.webview) {
      window.chrome.webview.postMessage('open-link:' + href);
    } else {
      window.open(href, '_blank', 'noopener');
    }
  });

  window.MDV = {
    // Contrato: puede llamarse multiples veces (recarga en vivo del archivo
    // que se esta viendo). Cada llamada REEMPLAZA el innerHTML del contenedor
    // (nunca lo anexa), y los listeners de arriba estan atados UNA sola vez al
    // contenedor persistente (#mdv-content, #mdv-export-btn), no al contenido
    // que se regenera en cada render -> cero fugas de listeners, cero nodos
    // duplicados sin importar cuantas veces se invoque.
    render: function (mdText, title) {
      var safeTitle = (title != null && String(title).trim() !== '')
        ? String(title).trim()
        : 'Documento sin titulo';

      document.title = safeTitle + ' \u2014 MDViewer';
      filenameEl.textContent = safeTitle;
      filenameEl.title = safeTitle; // tooltip nativo con el nombre completo si el CSS lo trunca (ellipsis)

      var text = (mdText == null) ? '' : String(mdText);

      if (text.trim() === '') {
        // Estado vacio: un archivo .md de 0 bytes no debe verse como una
        // pagina en blanco indistinguible de "todavia no cargo nada".
        showPlaceholder('Este archivo esta vacio.');
      } else {
        try {
          contentEl.innerHTML = marked.parse(text);
        } catch (err) {
          // Estado de error: si marked no puede interpretar el contenido, se
          // muestra un mensaje legible en vez de dejar la pantalla en blanco
          // o una excepcion sin manejar que tumbe el visor.
          showPlaceholder('No se pudo interpretar este Markdown: ' + (err && err.message ? err.message : String(err)));
        }
      }

      // Al abrir un archivo NUEVO (titulo distinto) se vuelve al inicio de la
      // pagina. En una recarga en vivo del MISMO archivo (el usuario esta
      // editando y guardando en su editor de texto) se respeta la posicion de
      // scroll para no interrumpir la lectura en curso.
      if (safeTitle !== lastTitle) {
        window.scrollTo(0, 0);
      }
      lastTitle = safeTitle;
    }
  };
})();
</script>

</body>
</html>
